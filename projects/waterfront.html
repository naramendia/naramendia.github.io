    <style>
        body, html {
            font-family: 'Montserrat', sans-serif;
        }
        .project-pages-text {
            text-align: left;
            line-height: 1.75;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 20px;
            justify-items: center;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .image-grid img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            object-fit: cover;
        }
        .image-grid figcaption {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 0.95rem;
            color: #555;
            margin-top: 0.75rem;
        }
    </style>
</head>

<body>
    <header>

            <a href="../cv.html" class="nav-button">CV</a>
            <a href="../contact.html" class="nav-button">CONTACT</a>
        </nav>
    </header>



    <main>
        <div>
            <div class="container-div">
                <a href="../projects.html" class="back-button">&#8592; Back to Projects</a>

                <p class="project-pages-text">Research in process ~ coming soon! <br>
                
            
            </div>

    </main>






    <footer>
        <p>© 2025 Natalie Aramendia</p>
    </footer>

    <script>
        let list = document.querySelectorAll('.list');
        let itemBox = document.querySelectorAll('.itemBox');

        for (let i = 0; i < list.length; i++) {
            list[i].addEventListener('click', function () {
                for (let j = 0; j < list.length; j++) {
                    list[j].classList.remove('active');
                }
                this.classList.add('active');

                let dataFilter = this.getAttribute('data-filter');

                for (let k = 0; k < itemBox.length; k++) {
                    itemBox[k].classList.remove('active');
                    itemBox[k].classList.add('hide');

                    const tags = (itemBox[k].getAttribute('data-item') || '')
                        .split(/[\s,]+/)
                        .map(tag => tag.trim().toLowerCase())
                        .filter(Boolean);

                    if (
                        tags.includes(dataFilter.toLowerCase()) ||
                        dataFilter === 'all'
                    ) {
                        itemBox[k].classList.remove('hide');
                        itemBox[k].classList.add('active');
                    }
                }
            });
        }
    </script>
    <script src="../js/nav.js" defer></script>
</body>
